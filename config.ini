[General]
Enabled=true
DebugMode=false
ShowNotifications=true

[Performance]
; City-event spawn distance around the player.
UpdateIntervalMs=1000
MinimumEventDistance=150
MaximumEventDistance=300
MaxActiveEvents=3
; Extra distance beyond the detected road edge, not beyond the road centre.
RoadsideOffsetMinMeters=2.0
RoadsideOffsetMaxMeters=6.0

[LivingCity]
Enabled=true
MorningStart=6
EveningStart=19
NightStart=23
DayActivityMultiplier=1.0
NightActivityMultiplier=0.65

[CityEvents]
Enabled=true
EventCheckIntervalSeconds=30
EventChancePercent=75
RoadsideBreakdownEnabled=true
RoadsideHikerEnabled=true
; Chance of a hiker scene on suitable rural roads.
RoadsideHikerChancePercent=20
RuralSearchAttempts=18
RuralSpawnPreferencePercent=90

[Traffic]
; Scales GTA's normal ambient population. It does not create extra vehicles.
; 1.0 = 100% of the population configured by popcycle.dat/popgroups.ymt.
Enabled=true
DensityMultiplier=1.0
ParkedDensity=1.0
