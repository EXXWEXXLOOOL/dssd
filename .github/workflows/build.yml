name: Build Living Los Santos

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Download ScriptHookVDotNet 3 API
        shell: pwsh
        run: |
          $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/scripthookvdotnet/scripthookvdotnet-nightly/releases/latest' -Headers @{ 'Accept' = 'application/vnd.github+json'; 'User-Agent' = 'LivingLosSantos-CI' }
          $asset = $release.assets | Where-Object { $_.name -like '*.zip' } | Select-Object -First 1
          if (-not $asset) { throw 'No ScriptHookVDotNet ZIP asset found in the latest nightly release.' }
          $archive = Join-Path $env:RUNNER_TEMP 'shvdn.zip'
          $install = Join-Path $env:RUNNER_TEMP 'shvdn'
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $install -Force
          $api = Get-ChildItem -Path $install -Recurse -Filter 'ScriptHookVDotNet3.dll' | Select-Object -First 1
          if (-not $api) { throw 'ScriptHookVDotNet3.dll was not found in the downloaded archive.' }
          $gta = Get-ChildItem -Path $install -Recurse -Filter 'GTA.dll' | Select-Object -First 1
          if (-not $gta) { throw 'GTA.dll was not found in the downloaded archive.' }
          $refs = Join-Path $env:RUNNER_TEMP 'gta-refs'
          New-Item -ItemType Directory -Force -Path (Join-Path $refs 'scripts') | Out-Null
          Copy-Item $api.FullName (Join-Path $refs 'scripts\ScriptHookVDotNet3.dll')
          Copy-Item $gta.FullName (Join-Path $refs 'scripts\GTA.dll')
          "SHVDN_ROOT=$refs" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build Release
        run: msbuild src/LivingLosSantos.sln /m /p:Configuration=Release /p:Platform="Any CPU" /p:GtaVPath="$env:SHVDN_ROOT" /verbosity:minimal

      - name: Package mod
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'LivingLosSantos'
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item 'src/LivingLosSantos/bin/Release/LivingLosSantos.dll' $package
          Copy-Item 'config.ini' $package
          Compress-Archive -Path (Join-Path $package '*') -DestinationPath 'LivingLosSantos.zip' -Force

      - name: Upload compiled mod
        uses: actions/upload-artifact@v4
        with:
          name: LivingLosSantos
          path: LivingLosSantos.zip
          if-no-files-found: error
          retention-days: 30
