name: Build Living Los Santos

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Download ScriptHookVDotNet 3.6.0 API
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'shvdn-3.6.0.zip'
          $install = Join-Path $env:RUNNER_TEMP 'shvdn-3.6.0'
          $downloadUrl = 'https://github.com/scripthookvdotnet/scripthookvdotnet/releases/download/v3.6.0/ScriptHookVDotNet.zip'
          Invoke-WebRequest -Uri $downloadUrl -OutFile $archive -Headers @{ 'User-Agent' = 'LivingLosSantos-CI' }
          Expand-Archive -Path $archive -DestinationPath $install -Force
          $api = Get-ChildItem -Path $install -Recurse -Filter 'ScriptHookVDotNet3.dll' | Select-Object -First 1
          if (-not $api) { throw 'ScriptHookVDotNet3.dll was not found in the official v3.6.0 archive.' }
          $apiVersion = [System.Reflection.AssemblyName]::GetAssemblyName($api.FullName).Version
          if ($apiVersion -ne [version]'3.6.0.0') { throw "Expected ScriptHookVDotNet3 API 3.6.0.0, found $apiVersion." }
          Write-Host "Using ScriptHookVDotNet3 API $apiVersion from $($api.FullName)"
          $refs = Join-Path $env:RUNNER_TEMP 'gta-refs'
          New-Item -ItemType Directory -Force -Path (Join-Path $refs 'scripts') | Out-Null
          Copy-Item $api.FullName (Join-Path $refs 'scripts\ScriptHookVDotNet3.dll')
          "SHVDN_ROOT=$refs" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build Release
        run: msbuild src/LivingLosSantos.sln /m /p:Configuration=Release /p:Platform="Any CPU" /p:GtaVPath="$env:SHVDN_ROOT" /verbosity:minimal

      - name: Package mod
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'LivingLosSantos'
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item 'src/LivingLosSantos/bin/Release/LivingLosSantos.dll' $package
          Copy-Item 'config.ini' $package
          Compress-Archive -Path (Join-Path $package '*') -DestinationPath 'LivingLosSantos.zip' -Force

      - name: Upload compiled mod
        uses: actions/upload-artifact@v4
        with:
          name: LivingLosSantos-SHVDN-3.6.0
          path: LivingLosSantos.zip
          if-no-files-found: error
          retention-days: 30
